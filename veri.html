let mem={},data=null,counted={},pending=null,msg="",modal=null,q="",fl={},imgDir=null,imgMap=null,imgPerm=false,imgCache=new Map(),big=null,cw={},vs={},vp=null,diag=null,repTxt="",cp={order:[],on:{}},cpop=false,prod=null,hl=null,nf="",prev=null,h1b=true,sf=new Set(),custom=[],forms={},ik={v:"liste",draft:{bar:"",foto:null,ger:"",adet:1}},ikL=[],ikS=null,defter={e:{},a:{}},bn="",kirik={list:[],hist:[]},kv="liste",ksel=new Set(),kmsg="",kf=false,pa=false,pcode="",perr="",rf=new Set(),limv=20,sort=["kod",1],page=0;
const idb=()=>new Promise((res,rej)=>{try{const r=indexedDB.open("env",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});
async function idbGet(k){try{const d=await idb();return await new Promise((res,rej)=>{const g=d.transaction("kv").objectStore("kv").get(k);g.onsuccess=()=>res(g.result);g.onerror=()=>rej(g.error)})}catch(e){return mem[k]}}

// ---- Firebase eşitleme ----
// Sayfa Mağaza Rapor'un Veri sekmesinde açıldığında kayıtlar mağazanın altına yazılır: stores/{mağaza}/veriKv.

async function sikistir(s){if(typeof CompressionStream==="undefined")return null;const b=await new Response(new Blob([s]).stream().pipeThrough(new CompressionStream("gzip"))).blob();return(await b64(b)).split(",")[1]}
async function ac64(z){const ik=atob(z),u=new Uint8Array(ik.length);for(let i=0;i<ik.length;i++)u[i]=ik.charCodeAt(i);return await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream("gzip"))).text()}
async function bulutYazHemen(k,v){try{const ham=JSON.stringify(await paketle(v===undefined?null:v)),gz=ham.length>20000?await sikistir(ham):null,j=gz||ham,z=gz?1:0,n=Math.max(1,Math.ceil(j.length/PARCA)),t=Date.now(),col=bCol(),id=bId(k);
 await Promise.all(Array.from({length:n-1},(_,x)=>col.doc(id+"~"+(x+1)).set({v:j.slice((x+1)*PARCA,(x+2)*PARCA)})));

 const eski=(bSurum[k]&&bSurum[k].n)||0;for(let i=n;i<eski;i++)col.doc(id+"~"+i).delete().catch(()=>{});
 bSurum[k]={k,t,n};bBen.add(k+"@"+t);await col.doc("_surum").set({[id]:{k,t,n}},{merge:true})}

function bulutYaz(k,v){clearTimeout(bZam[k]);bZam[k]=setTimeout(()=>bulutYazHemen(k,v),600)}

const bLog=[];function bulutHata(m){msg=m;bLog.push(new Date().toLocaleTimeString("tr-TR")+" "+m);if(bLog.length>20)bLog.shift();if(diag)diag.bulut=m;try{render()}catch(e){}}
const bHazir=B?bCol().doc("_surum").get().then(d=>{const o=d.exists?d.data():{};for(const x of Object.values(o))if(x&&x.k)bSurum[x.k]=x}).catch(e=>bulutHata("Buluttan okunamadı: "+e.message)):Promise.resolve();
async function kvGet(k){if(!B||BULUT_HARIC.has(k))return idbGet(k);await bHazir;if(k in mem)return mem[k];

 const v=await idbGet(k);if(v!==undefined&&v!==null&&(!bSurum[k]||bozuk))bulutYaz(k,v);mem[k]=v;return v}
async function kvSet(k,v){mem[k]=v;await idbPut(k,v);if(B&&!BULUT_HARIC.has(k))bulutYaz(k,v)}
// Başka cihaz yazınca: değişen kayıtlar yeniden okunur, sayfa yenilenir.
if(B)bHazir.then(()=>{bUnsub=bCol().doc("_surum").onSnapshot(d=>{const o=d.exists?d.data():{},deg=[];for(const x of Object.values(o)){if(!x||!x.k)continue;const e=bSurum[x.k];if((!e||e.t!==x.t)&&!bBen.has(x.k+"@"+x.t))deg.push(x.k);bSurum[x.k]=x}
 if(!deg.length)return;deg.forEach(k=>delete mem[k]);(async()=>{if(ikS&&deg.includes("sv:"+ikS.id))ikS=await kvGet("sv:"+ikS.id);await veriYukle()})()},()=>{})});
window.addEventListener("pagehide",()=>{if(bUnsub){try{bUnsub()}catch(e){}bUnsub=null}});
const isCounted=k=>counted[k]&&Date.now()-counted[k]<28*864e5;

{id:"eksi",t:"Eksi stok kontrolü",d:"Envanteri eksiye düşen satırı olan ürünler. Sayıma karışmaz.",f:P=>P.filter(p=>p.neg),c:C,w:1},

{id:"kirik",t:"Mevcut kırıklar",d:"Elindeki kırık ürünleri barkodla listele. Çıkış yapınca geçmişe taşınır, stok tablosunda Kırık sütununda görünür.",f:()=>[],c:[],kr:1},
{id:"ikinci",t:"İkinci kalite sevki",d:"Barkod ve fotoğraf kaydı, WhatsApp ile müdür onayı, ERP kodu. Süreç adım adım izlenir.",f:()=>[],c:[],ik:1},
{id:"degisim",t:"Stok değişim raporu",d:"Önceki dosyayla karşılaştırır: artan, azalan, yeni ve kaybolan ürünler.",f:P=>{if(!prev)return[];const m=new Map(),an=new Map();prev.rows.forEach(r=>{m.set(r.kod,(m.get(r.kod)||0)+r.env);an.set(r.kod,r.ad)});const out=[],seen=new Set();for(const p of P){seen.add(p.kod);const o=m.get(p.kod);if(o===undefined)out.push({...p,once:"",fark:p.tot,dur:"Yeni ürün"});else if(o!==p.tot)out.push({...p,once:o,fark:p.tot-o,dur:p.tot-o>0?"Arttı":"Azaldı"})}for(const[k,o]of m)if(!seen.has(k))out.push({kod:k,ad:an.get(k),grup:"",tot:0,sevk:0,once:o,fark:-o,dur:"Dosyada yok"});return out.sort((a,b)=>Math.abs(b.fark)-Math.abs(a.fark))},c:[["kod","Ürün kodu"],["ad","Ürün adı"],["once","Önceki","n"],["tot","Şimdi","n"],["fark","Fark","n"],["dur","Durum"]],u:"değişti"},

const VC=[["kod","Ürün kodu"],["bar","Barkod"],["ad","Ürün adı"],["renk","Renk"],["beden","Beden"],["env","Envanter","n"],["sevk","Onaysız sevk","n"],["grup","Ana grup"],["marka","Marka"],["sezon","Yıl-Sezon"]];
const tbl=(c,rows,chk,fr)=>`<div class="box${fr?" v":""}"><table style="table-layout:fixed;min-width:0;width:${tw(c,chk)}px">${cg(c,chk)}<tr>${chk?"<th></th>":""}${imgOn()?"<th>Resim</th>":""}${c.map(x=>`<th class="${x[2]||""}" data-sort="${x[0]}">${x[1]}${fr&&sort[0]===x[0]?(sort[1]>0?" ▲":" ▼"):""}${fr?`<button class="vf${vs[x[0]]?" act":""}" data-vf="${x[0]}" aria-label="${x[1]} değer filtresi"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 4h18l-7 8v7l-4 2v-9z"/></svg></button>`:""}<span class="rz" data-rz="${x[0]}"></span></th>`).join("")}</tr>${fr?`<tr>${imgOn()?"<td></td>":""}${c.map(x=>`<td style="padding:2px 4px"><input type="search" data-f="${x[0]}" value="${esc(fl[x[0]]||"")}" placeholder="${x[2]?"<=10":"Filtre"}" aria-label="${x[1]} filtre" style="min-width:0;width:100%;min-height:26px;font-size:12px"></td>`).join("")}</tr>`:""}${rows.map(r=>`<tr data-pk="${esc(r.kod)}" class="${rc(r)}">${chk?`<td><input type="checkbox" data-kod="${esc(r.kod)}" aria-label="Seç"></td>`:""}${imgOn()?`<td><img data-img="${esc(r.kod)}" alt="" style="width:28px;height:28px;object-fit:cover;border-radius:4px;background:var(--chip);cursor:zoom-in"></td>`:""}${c.map(x=>`<td class="${x[2]||""}${(x[0]==="env"||x[0]==="tot"||x[0]==="fark")&&r[x[0]]<0?" neg":""}">${esc(r[x[0]])}</td>`).join("")}</tr>`).join("")}</table></div>`;
